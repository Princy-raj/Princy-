<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPORA — Maison de Luxe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{serif:['Cormorant Garamond','serif'],sans:['Plus Jakarta Sans','sans-serif']},colors:{navy:{900:'#121D2B',800:'#172536',700:'#1E3147'},sand:{100:'#F7F4F0',200:'#EFE9E0',300:'#E4DBD0'},gold:{500:'#D4AF37',600:'#C5A059'},terra:{600:'#C86D51'}}}}}
</script>
<style>
body{background:#F7F4F0;color:#121D2B} .lux-card{background:white;border:1px solid #E4DBD0;border-radius:18px;overflow:hidden}
.btn{background:#121D2B;color:white;padding:11px 16px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.btn:hover{background:#D4AF37;color:#121D2B}.field{width:100%;padding:12px;border:1px solid #E4DBD0;border-radius:10px;background:#F7F4F0;font-size:13px;outline:none}.field:focus{border-color:#C5A059}
.navbtn{font-size:12px;font-weight:600}.navbtn:hover{color:#D4AF37}.product-img{width:100%;aspect-ratio:1;object-fit:cover;background:#EFE9E0}
</style>
</head>
<body class="font-sans antialiased">
<div class="bg-navy-900 text-sand-200 text-center text-[10px] sm:text-xs py-2 tracking-widest uppercase">Complimentary Express Shipping on Orders Over ₹2,500 &nbsp; | &nbsp; Use Code: <b class="text-gold-500">SHOPORA10</b></div>
<header class="sticky top-0 z-40 bg-navy-800/95 backdrop-blur text-sand-100 border-b border-navy-700">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 h-[76px] flex items-center justify-between gap-3">
  <button onclick="showView('store')" class="flex items-center gap-3 text-left group" aria-label="Shopora home">
   <span class="w-12 h-12 rounded-2xl flex items-center justify-center border border-gold-500/50 bg-gradient-to-br from-[#f5dce3] via-[#d99bad] to-[#8e526c] shadow-lg group-hover:scale-105 transition-transform">
    <svg viewBox="0 0 48 48" width="38" height="38" fill="none" aria-hidden="true">
     <path d="M12 18h24l-2.5 22h-19L12 18Z" stroke="#fff8f0" stroke-width="1.8" stroke-linejoin="round"/>
     <path d="M17 19v-5a7 7 0 0 1 14 0v5" stroke="#fff8f0" stroke-width="1.8" stroke-linecap="round"/>
     <path d="M24 32s-6-3.7-6-7.2a3.5 3.5 0 0 1 6-2.4 3.5 3.5 0 0 1 6 2.4C30 28.3 24 32 24 32Z" fill="#fff8f0"/>
     <path d="M37 8v5M34.5 10.5h5" stroke="#f8e7b5" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
   </span>
   <span><span class="font-serif text-[25px] sm:text-[27px] tracking-[.18em] font-bold text-white">SHOPORA</span><span class="flex items-center gap-2 text-[8px] tracking-[3px] text-[#e8bdca] uppercase"><span class="h-px w-4 bg-gold-500"></span>Maison de Luxe<span class="h-px w-4 bg-gold-500"></span></span></span>
  </button>
  <div class="hidden md:block flex-1 max-w-sm mx-5 relative"><i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-sand-300"></i><input id="search" oninput="renderProducts()" placeholder="Search curated collections..." class="w-full rounded-full bg-navy-900 border border-navy-700 pl-10 pr-4 py-2.5 text-xs text-white outline-none focus:border-gold-500"></div>
  <nav class="flex items-center gap-3 sm:gap-5"><button class="navbtn hidden sm:block" onclick="showView('store')">Collection</button><button class="navbtn" onclick="showView('orders')">Orders</button><button class="navbtn text-gold-500" onclick="showView('admin')">Admin</button><button class="navbtn" onclick="showView('cart')"><i data-lucide="shopping-bag" class="inline w-4 h-4"></i> Bag <span id="cartCount">0</span></button></nav>
 </div>
</header>
<main id="main" class="min-h-screen"></main>
<footer class="bg-navy-900 text-sand-200 text-center py-9 mt-16"><div class="flex items-center justify-center gap-3"><span class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#f5dce3] to-[#8e526c] flex items-center justify-center"><svg viewBox="0 0 48 48" width="30" height="30" fill="none" aria-hidden="true"><path d="M12 18h24l-2.5 22h-19L12 18Z" stroke="#fff8f0" stroke-width="2" stroke-linejoin="round"/><path d="M17 19v-5a7 7 0 0 1 14 0v5" stroke="#fff8f0" stroke-width="2" stroke-linecap="round"/><path d="M24 32s-6-3.7-6-7.2a3.5 3.5 0 0 1 6-2.4 3.5 3.5 0 0 1 6 2.4C30 28.3 24 32 24 32Z" fill="#fff8f0"/></svg></span><div class="text-left"><div class="font-serif text-2xl tracking-[4px] text-white">SHOPORA</div><div class="text-[8px] tracking-[3px] text-[#e8bdca]">MAISON DE LUXE</div></div></div><p class="text-xs mt-4 opacity-60">Curated elegance for everyday living.</p><p class="text-[10px] mt-4 opacity-50">© <span id="copyrightYear">2026</span> SHOPORA. All Rights Reserved.</p></footer>
<div id="toast" class="fixed bottom-5 right-5 z-50 bg-navy-900 text-white border border-gold-500/50 px-5 py-3 rounded-xl shadow-xl text-sm opacity-0 translate-y-8 transition-all pointer-events-none"></div>
<script>
const starterProducts=[
{id:1,name:'Tote Handbag Luxe',category:'Bags',price:3499,stock:12,desc:'Crafted from supple full-grain leather with custom brass-toned hardware.',image:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=700&q=85'},
{id:2,name:'Apothecary Glass Serum',category:'Wellness',price:1850,stock:24,desc:'Botanical infusion housed in custom deep navy UV-protected glass.',image:'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=700&q=85'},
{id:3,name:'Minimalist Artisan Backpack',category:'Bags',price:4800,stock:8,desc:'Designed for daily executive commute with padded tech compartments.',image:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=85'},
{id:4,name:'Signature Cotton Tee',category:'Apparel',price:1299,stock:30,desc:'Ultra-soft combed organic cotton with tailored contemporary drape.',image:'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=700&q=85'},
{id:5,name:'Ceramic Pour-Over Flask',category:'Lifestyle',price:2100,stock:15,desc:'Matte glazed ceramic thermal flask designed for artisanal coffee lovers.',image:'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=700&q=85'}
];
let products=JSON.parse(localStorage.getItem('shopora_products')||'null')||starterProducts;
let categories=JSON.parse(localStorage.getItem('shopora_categories')||'null')||['Bags','Wellness','Apparel','Lifestyle'];
let cart=JSON.parse(localStorage.getItem('shopora_cart')||'[]');
let orders=JSON.parse(localStorage.getItem('shopora_orders')||'null')||[
{id:'ORD-9821',date:'2026-11-15',items:[{name:'Tote Handbag Luxe',qty:1,price:3499}],total:3811,status:'Out for Delivery',payment:'UPI'},
{id:'ORD-9822',date:'2026-11-17',items:[{name:'Apothecary Glass Serum',qty:2,price:1850}],total:4073,status:'Processing',payment:'Credit Card'}
];
let activeCategory='All';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem('shopora_products',JSON.stringify(products));localStorage.setItem('shopora_categories',JSON.stringify(categories));localStorage.setItem('shopora_cart',JSON.stringify(cart));localStorage.setItem('shopora_orders',JSON.stringify(orders))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('opacity-0','translate-y-8');setTimeout(()=>t.classList.add('opacity-0','translate-y-8'),2400)}
function icons(){if(window.lucide)lucide.createIcons()}
let adminAuthenticated=sessionStorage.getItem('shopora_admin_auth')==='yes';
function showView(v){if(v==='store')renderStore();if(v==='admin'){if(adminAuthenticated)renderAdmin();else renderAdminLogin()}if(v==='cart')renderCart();if(v==='checkout')renderCheckout();if(v==='orders')renderOrders();window.scrollTo({top:0,behavior:'smooth'});icons()}
function renderAdminLogin(){document.getElementById('main').innerHTML=`<section class="max-w-md mx-auto px-4 py-16"><div class="lux-card p-7 sm:p-9 shadow-xl"><div class="text-center mb-7"><div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-[#f5dce3] to-[#8e526c] flex items-center justify-center text-2xl">🛍</div><h1 class="font-serif text-3xl font-bold mt-4">SHOPORA</h1><p class="text-[10px] tracking-[3px] text-gold-600 mt-1">ADMIN PORTAL</p><p class="text-xs opacity-60 mt-4">Sign in to manage your store</p></div><form id="adminLoginForm" class="space-y-4"><div><label class="text-xs font-semibold block mb-2">Username</label><input id="adminUsername" class="field" autocomplete="username" placeholder="Enter username" required></div><div><label class="text-xs font-semibold block mb-2">Password</label><input id="adminPassword" type="password" class="field" autocomplete="current-password" placeholder="Enter password" required></div><p id="adminLoginError" class="text-xs text-red-600 hidden">Incorrect username or password.</p><button class="btn w-full">LOGIN TO ADMIN</button></form><p class="text-[10px] text-center opacity-50 mt-5">Authorized Admin Access Only</p></div></section>`;document.getElementById('adminLoginForm').onsubmit=e=>{e.preventDefault();const u=document.getElementById('adminUsername').value;const pw=document.getElementById('adminPassword').value;if(u==='admin'&&pw==='System'){adminAuthenticated=true;sessionStorage.setItem('shopora_admin_auth','yes');renderAdmin();toast('Admin login successful')}else{document.getElementById('adminLoginError').classList.remove('hidden')}}}
function adminLogout(){adminAuthenticated=false;sessionStorage.removeItem('shopora_admin_auth');renderAdminLogin();toast('Logged out successfully')}
function renderStore(){
document.getElementById('main').innerHTML=`
<section class="bg-sand-200 border-b border-sand-300 py-12 sm:py-20"><div class="max-w-7xl mx-auto px-4 sm:px-6 grid md:grid-cols-2 gap-10 items-center">
<div><span class="inline-flex bg-navy-900 text-gold-500 rounded-full px-4 py-2 text-[10px] tracking-widest uppercase">✦ Autumn / Winter Collection</span><h1 class="font-serif text-5xl sm:text-6xl font-bold leading-[1.02] mt-6">Timeless Elegance, <i class="font-normal">Curated for You.</i></h1><p class="text-sm text-navy-900/70 leading-7 max-w-lg mt-5">Discover Shopora's signature artisanal range of handcrafted leather goods, luxury botanical serums, and lifestyle essentials.</p><a href="#catalog" class="btn inline-block mt-6">Explore Catalog</a></div>
<div class="bg-white/80 p-5 rounded-3xl shadow-xl border border-sand-300 max-w-md mx-auto w-full"><img src="${products[0]?.image||''}" class="w-full h-64 object-cover rounded-2xl" alt="Featured collection"><div class="flex justify-between items-center mt-4"><div><span class="text-[10px] text-gold-600 font-bold tracking-widest">EDITOR'S CHOICE</span><h3 class="font-serif text-xl font-bold"> ${products[0]?.name||'Shopora Collection'}</h3></div><b>${products[0]?money(products[0].price):''}</b></div></div>
</div></section>
<section id="catalog" class="max-w-7xl mx-auto px-4 sm:px-6 py-14"><div class="flex flex-wrap justify-between items-end gap-4"><div><span class="text-gold-600 text-[10px] font-bold tracking-widest uppercase">Maison Catalog</span><h2 class="font-serif text-4xl font-bold mt-1">Curated Masterpieces</h2></div><input id="storeSearch" class="field max-w-xs" placeholder="Search products..." oninput="renderProducts()"></div><div id="categoryFilters" class="flex flex-wrap gap-2 my-7"></div><div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div></section>`;
activeCategory='All';renderProducts();
}
function renderProducts(){
let q=(document.getElementById('storeSearch')?.value||document.getElementById('search')?.value||'').toLowerCase();
let f=document.getElementById('categoryFilters');if(f)f.innerHTML=['All',...categories].map(c=>`<button onclick="setCategory('${esc(c)}')" class="px-4 py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider ${activeCategory===c?'bg-navy-900 text-white':'bg-sand-200 hover:bg-sand-300'}">${esc(c==='All'?'All Items':c)}</button>`).join('');
let grid=document.getElementById('productGrid');if(!grid)return;
let list=products.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&(`${p.name} ${p.category} ${p.desc}`).toLowerCase().includes(q));
grid.innerHTML=list.length?list.map(p=>`<article class="lux-card group"><button type="button" class="relative overflow-hidden block w-full text-left" onclick="openProductPreview(${p.id})"><img class="product-img group-hover:scale-105 transition duration-500" src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.src='https://placehold.co/600x600/F7F4F0/172536?text=Shopora'"><span class="absolute top-3 left-3 bg-navy-900/90 text-white text-[9px] uppercase tracking-wider px-2 py-1 rounded">${esc(p.category)}</span><span class="absolute bottom-3 right-3 bg-white/90 text-navy-900 text-[9px] px-3 py-2 rounded-full font-bold">VIEW DETAILS ↗</span></button><div class="p-4"><button type="button" onclick="openProductPreview(${p.id})" class="font-serif text-lg font-bold text-left">${esc(p.name)}</button><p class="text-[11px] text-navy-900/60 leading-5 mt-1 min-h-10">${esc(p.desc)}</p><div class="flex justify-between items-center border-t border-sand-200 pt-3 mt-3"><b class="text-sm">${money(p.price)}</b><button onclick="addToCart(${p.id})" class="bg-navy-900 hover:bg-gold-500 text-white hover:text-navy-900 w-9 h-9 rounded-lg">＋</button></div></div></article>`).join(''):'<p class="col-span-full text-center py-12 text-sm opacity-60">No products found. Try another search.</p>';
}
function setCategory(c){activeCategory=c;renderProducts()}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p)return;let i=cart.find(x=>x.id===id);if(i)i.qty++;else cart.push({...p,qty:1});save();updateCount();toast(p.name+' added to bag')}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function totals(){let sub=cart.reduce((s,x)=>s+x.price*x.qty,0),tax=Math.round(sub*.18),shipping=sub===0||sub>=2500?0:150;return{sub,tax,shipping,total:sub+tax+shipping}}
function renderCart(){let t=totals();document.getElementById('main').innerHTML=`<section class="max-w-4xl mx-auto px-4 py-12"><h1 class="font-serif text-4xl font-bold mb-7">Your Shopping Bag</h1><div class="lux-card p-5 sm:p-8">${cart.length?cart.map(i=>`<div class="flex gap-4 items-center py-4 border-b border-sand-200"><img src="${esc(i.image)}" class="w-20 h-20 rounded-xl object-cover"><div class="flex-1"><b class="font-serif text-lg">${esc(i.name)}</b><p class="text-xs mt-1">${money(i.price)}</p><div class="flex items-center gap-3 mt-2"><button class="px-2 bg-sand-200 rounded" onclick="changeQty(${i.id},-1)">−</button><span class="text-sm">${i.qty}</span><button class="px-2 bg-sand-200 rounded" onclick="changeQty(${i.id},1)">+</button></div></div><b>${money(i.price*i.qty)}</b></div>`).join(''):'<p class="py-12 text-center">Your shopping bag is empty.</p>'}<div class="max-w-sm ml-auto mt-6 space-y-3 text-sm"><div class="flex justify-between"><span>Subtotal</span><b>${money(t.sub)}</b></div><div class="flex justify-between"><span>Estimated GST (18%)</span><b>${money(t.tax)}</b></div><div class="flex justify-between"><span>Shipping</span><b>${t.shipping?money(t.shipping):'FREE'}</b></div><div class="flex justify-between border-t pt-3 text-lg font-bold"><span>Total</span><span>${money(t.total)}</span></div><button class="btn w-full mt-3" onclick="showView('checkout')" ${cart.length?'':'disabled'}>Proceed to Checkout</button></div></div></section>`}
function changeQty(id,n){let x=cart.find(i=>i.id===id);if(x)x.qty+=n;cart=cart.filter(i=>i.qty>0);save();updateCount();renderCart()}
function renderCheckout(){if(!cart.length){showView('cart');return}let t=totals();document.getElementById('main').innerHTML=`<section class="max-w-5xl mx-auto px-4 py-12"><h1 class="font-serif text-4xl font-bold mb-2">Secure Checkout</h1><p class="text-xs opacity-60 mb-8">Choose your preferred payment method.</p><div class="grid md:grid-cols-3 gap-6"><div class="md:col-span-2 lux-card p-6"><h2 class="font-serif text-2xl font-bold mb-5">Shipping Address</h2><form id="checkoutForm" class="grid sm:grid-cols-2 gap-3"><input required id="custName" class="field" placeholder="Full Name"><input required id="custPhone" class="field" placeholder="Mobile Number"><input required id="custAddress" class="field sm:col-span-2" placeholder="Street Address"><input required id="custCity" class="field" placeholder="City"><input required id="custPin" class="field" placeholder="Pincode"><h2 class="font-serif text-2xl font-bold sm:col-span-2 mt-5">Payment Method</h2>
<div class="sm:col-span-2 grid grid-cols-2 sm:grid-cols-3 gap-3">
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="Google Pay (UPI)" checked><span class="inline-flex items-center gap-2"><svg viewBox="0 0 48 48" width="30" height="30" aria-label="Google Pay logo"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg><span class="font-bold text-sm" style="color:#4285F4">Google Pay</span></span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="PhonePe (UPI)"><span class="inline-flex items-center gap-2"><svg viewBox="0 0 48 48" width="32" height="32" role="img" aria-label="PhonePe logo"><circle cx="24" cy="24" r="23" fill="#5F259F"/><path d="M28.9 8.5H18.2v5.1h7.3c2.2 0 3.6 1.2 3.6 3.1 0 1.8-1.4 3-3.6 3h-7.3v19.8h5.5V25h4.6c5.1 0 8.5-3.2 8.5-8.2 0-5.1-3.3-8.3-7.9-8.3Z" fill="#fff"/></svg><span class="font-bold text-sm" style="color:#5f259f">PhonePe</span></span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="Paytm (UPI)"><span class="inline-flex items-center gap-2"><svg viewBox="0 0 86 30" width="72" height="27" role="img" aria-label="Paytm logo"><text x="2" y="22" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-1"><tspan fill="#002970">pay</tspan><tspan fill="#00BAF2">tm</tspan></text></svg></span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="Other UPI"><span class="font-bold text-sm">Other UPI</span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="Net Banking"><span class="font-bold text-sm">Net Banking</span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100"><input type="radio" name="paymentChoice" value="Razorpay QR (Demo)"><span class="inline-flex items-center gap-2"><svg viewBox="0 0 48 48" width="30" height="30" aria-label="Razorpay logo"><path fill="#2B5CAB" d="M8 5h32L22 43h-9l8-18H8l5-9h12l4-6H8z"/><path fill="#3395FF" d="M29 5h11L25 27h-9z"/></svg><span class="font-bold text-sm" style="color:#2b5cab">Razorpay</span></span></label>
<label class="border border-sand-300 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-gold-500 has-[:checked]:bg-sand-100 sm:col-span-3"><input type="radio" name="paymentChoice" value="Cash on Delivery"><span class="font-bold text-sm">Cash on Delivery</span></label>
</div>

const choices=[...document.querySelectorAll('input[name="paymentChoice"]')];function updatePaymentUI(){const v=document.querySelector('input[name="paymentChoice"]:checked')?.value||'';document.getElementById('netBankingChoice').classList.toggle('hidden',v!=='Net Banking');document.getElementById('razorpayInfo').classList.toggle('hidden',v!=='Razorpay QR (Demo)');document.getElementById('upiInfo').classList.toggle('hidden',!v.includes('UPI'));if(v.includes('UPI')){const app=v.split(' ')[0];document.getElementById('upiInfo').innerHTML='<b>'+app+' selected</b><p class="text-xs opacity-70 mt-1">Your order will be saved in demo mode. To collect real UPI payments, connect a verified merchant UPI ID or Razorpay account.</p>'}}choices.forEach(x=>x.addEventListener('change',updatePaymentUI));updatePaymentUI();
function finishDemoOrder(paymentLabel){let order={id:'ORD-'+Math.floor(1000+Math.random()*9000),date:new Date().toISOString().slice(0,10),items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price})),total:t.total,status:'Processing',payment:paymentLabel+' (Demo - not charged)'};orders.unshift(order);cart=[];save();updateCount();toast('Demo payment successful — no money collected');showView('orders')}document.getElementById('demoPayButton')?.addEventListener('click',()=>{if(!document.getElementById('checkoutForm').reportValidity())return;finishDemoOrder('Razorpay simulated payment')});document.getElementById('checkoutForm').onsubmit=e=>{e.preventDefault();let selected=document.querySelector('input[name="paymentChoice"]:checked').value;if(selected==='Razorpay QR (Demo)'){toast('Use Simulate Successful Payment in the Razorpay demo panel');return}if(selected==='Net Banking')selected+=' - '+document.getElementById('bankName').value;finishDemoOrder(selected)}}
function renderOrders(){document.getElementById('main').innerHTML=`<section class="max-w-5xl mx-auto px-4 py-12"><h1 class="font-serif text-4xl font-bold mb-8">My Orders & Timeline</h1><div class="space-y-5">${orders.length?orders.map(o=>`<article class="lux-card p-6"><div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 border-b border-sand-200 pb-4 min-w-0"><div class="min-w-0"><span class="text-gold-600 text-xs font-bold">${o.id}</span><h3 class="font-serif text-xl font-bold">Placed on ${o.date||'Today'}</h3></div><div class="flex flex-wrap items-center gap-2 text-xs min-w-0 sm:justify-end"><span class="inline-flex max-w-full whitespace-normal break-words bg-sand-200 px-3 py-2 rounded-full leading-snug">${esc((o.payment||'').replace('Razorpay simulated payment (Demo - not charged)','Razorpay (Demo)'))}</span><span class="inline-flex bg-navy-900 text-gold-500 px-3 py-2 rounded-full whitespace-nowrap">${esc(o.status)}</span></div></div><div class="grid grid-cols-4 gap-2 text-center text-[10px] my-5">${['Processing','Shipped','Out for Delivery','Delivered'].map((s,i)=>`<div><div class="h-1.5 rounded ${['Processing','Shipped','Out for Delivery','Delivered'].indexOf(o.status)>=i?'bg-gold-500':'bg-sand-300'}"></div><p class="mt-2">${s}</p></div>`).join('')}</div>${(o.items||[]).map(i=>`<p class="text-sm flex justify-between py-1"><span>${esc(i.name)} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></p>`).join('')}<div class="border-t mt-4 pt-3 flex justify-between font-bold"><span>Total Paid</span><span>${money(o.total)}</span></div></article>`).join(''):'<p>No orders yet.</p>'}</div></section>`}
function renderAdmin(){let revenue=orders.reduce((s,o)=>s+o.total,0);document.getElementById('main').innerHTML=`<section class="max-w-7xl mx-auto px-4 sm:px-6 py-12"><div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><span class="text-gold-600 text-[10px] font-bold tracking-widest uppercase">Executive Dashboard</span><h1 class="font-serif text-4xl font-bold mt-1">Shopora Control Console</h1><p class="text-xs opacity-60 mt-2">Manage products, images, categories and customer orders.</p></div><div class="flex flex-wrap gap-2"><button onclick="adminLogout()" class="px-4 py-3 rounded-xl border border-sand-300 text-xs font-bold">LOG OUT</button><button onclick="openProductForm()" class="btn">＋ Add New Product</button></div></div>
<div class="grid sm:grid-cols-3 gap-4 mb-7">${[['Total Revenue',money(revenue)],['Orders',orders.length],['Catalog Items',products.length]].map(([a,b])=>`<div class="lux-card p-6"><span class="text-[10px] uppercase tracking-widest opacity-60">${a}</span><div class="font-serif text-3xl font-bold mt-2">${b}</div></div>`).join('')}</div>
<div class="lux-card p-6 mb-7"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="font-serif text-2xl font-bold">Manage Store Sections</h2><p class="text-xs opacity-60 mt-1">Create categories that appear automatically on your store page.</p></div><button onclick="openCategoryForm()" class="btn">＋ Add Section</button></div><div class="flex flex-wrap gap-2">${categories.map(c=>`<span class="bg-sand-200 px-4 py-2 rounded-lg text-xs font-semibold">${esc(c)} <button onclick="deleteCategory('${esc(c)}')" class="ml-2 text-red-600 font-bold" title="Delete section">×</button></span>`).join('')||'<p class="text-xs opacity-60">No sections yet.</p>'}</div></div>
<div class="grid lg:grid-cols-2 gap-6"><div class="lux-card p-6"><h2 class="font-serif text-2xl font-bold mb-4">Manage Inventory</h2><div class="space-y-3 max-h-[520px] overflow-auto">${products.map(p=>`<div class="flex items-center gap-3 border-b border-sand-200 pb-3"><img src="${esc(p.image)}" class="w-14 h-14 rounded-lg object-cover" onerror="this.src='https://placehold.co/100?text=Image'"><div class="flex-1 min-w-0"><b class="text-sm block truncate">${esc(p.name)}</b><span class="text-[11px] opacity-60">${esc(p.category)} · ${money(p.price)} · Stock ${p.stock}</span></div><button onclick="editProduct(${p.id})" class="text-xs text-gold-600 font-bold">EDIT</button><button onclick="deleteProduct(${p.id})" class="text-xs text-red-600 font-bold">DELETE</button></div>`).join('')||'<p class="text-sm opacity-60">No products added yet.</p>'}</div></div>
<div class="lux-card p-6"><h2 class="font-serif text-2xl font-bold mb-4">Manage Customer Orders</h2><div class="space-y-4 max-h-[520px] overflow-auto">${orders.map(o=>`<div class="border-b border-sand-200 pb-3"><div class="flex justify-between gap-2"><b class="text-sm">${o.id}</b><b class="text-sm">${money(o.total)}</b></div><p class="text-[11px] opacity-60 my-2">Payment: ${esc(o.payment)}</p><select class="field" onchange="updateOrder('${o.id}',this.value)">${['Processing','Shipped','Out for Delivery','Delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="text-sm opacity-60">No orders yet.</p>'}</div></div></div></section>`}
function openProductForm(id=null){let p=id?products.find(x=>x.id===id):null;let overlay=document.createElement('div');overlay.id='modal';overlay.className='fixed inset-0 z-50 bg-navy-900/70 backdrop-blur-sm flex items-center justify-center p-4';overlay.innerHTML=`<div class="bg-white rounded-2xl p-6 w-full max-w-xl max-h-[92vh] overflow-auto"><div class="flex justify-between items-center mb-5"><h2 class="font-serif text-2xl font-bold">${p?'Edit Product':'Add New Product'}</h2><button onclick="document.getElementById('modal').remove()" class="text-2xl">×</button></div><form id="productForm" class="space-y-3"><label class="text-xs font-semibold">Product Name</label><input required id="pName" class="field" placeholder="e.g. Premium Leather Bag" value="${p?esc(p.name):''}"><label class="text-xs font-semibold">Category / Section</label><select required id="pCategory" class="field">${categories.map(c=>`<option ${p?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label class="text-xs font-semibold">Price (₹)</label><input required min="1" type="number" id="pPrice" class="field" placeholder="Enter price" value="${p?.price??''}"><label class="text-xs font-semibold">Stock Quantity</label><input required min="0" type="number" id="pStock" class="field" placeholder="Enter stock" value="${p?.stock??''}"><label class="text-xs font-semibold">Description</label><textarea id="pDesc" class="field" rows="3" placeholder="Product description">${p?esc(p.desc):''}</textarea><label class="text-xs font-semibold">Upload 3–4 Product Images from Phone Gallery</label><input type="file" id="pFile" accept="image/*" multiple class="field"><div class="text-[11px] text-navy-900/60">Select up to 4 photos. On most phones, long-press or use Select to choose multiple images. The first photo is the main product image.</div><label class="text-xs font-semibold block pt-2">Or use Product Image URL (optional)</label><input type="url" id="pImage" class="field" placeholder="Paste image URL (https://...)" value="${p && !p.image.startsWith('data:')?esc(p.image):''}"><div class="text-[11px] text-navy-900/60">Image previews (first image is the cover):</div><div id="imagePreviews" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div><button class="btn w-full mt-2">${p?'Save Changes':'Add Product'}</button></form></div>`;document.body.appendChild(overlay);let uploadedImages=(p?(p.images&&p.images.length?p.images:[p.image]):[]).filter(Boolean);const previewBox=document.getElementById('imagePreviews');function drawPreviews(){previewBox.innerHTML=uploadedImages.map((src,i)=>`<div class="relative"><img src="${esc(src)}" class="w-full h-28 object-cover rounded-lg border border-sand-200"><span class="absolute bottom-1 left-1 bg-navy-900/85 text-white text-[9px] px-2 py-1 rounded">${i===0?'COVER':'PHOTO '+(i+1)}</span><button type="button" onclick="removeProductPhoto(${i})" class="absolute top-1 right-1 bg-white text-red-600 rounded-full w-6 h-6 font-bold shadow">×</button></div>`).join('')||'<div class="col-span-2 sm:col-span-4 text-xs text-center p-6 bg-sand-100 rounded-xl">No images selected yet</div>'}window.removeProductPhoto=i=>{uploadedImages.splice(i,1);drawPreviews()};drawPreviews();const fileInput=document.getElementById('pFile');fileInput.addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);if(uploadedImages.length+files.length>4){alert('You can add a maximum of 4 images.');fileInput.value='';return;}for(const file of files){if(!file.type.startsWith('image/'))continue;try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const max=1000;const scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.72))};img.onerror=reject;img.src=ev.target.result};reader.onerror=reject;reader.readAsDataURL(file)});uploadedImages.push(data)}catch(err){alert('One image could not be loaded. Please try another photo.')}}drawPreviews();fileInput.value=''});document.getElementById('pImage').addEventListener('input',e=>{if(e.target.value.trim()){uploadedImages=[e.target.value.trim()];drawPreviews()}});document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const url=document.getElementById('pImage').value.trim();let imgs=uploadedImages.length?uploadedImages:(url?[url]:[]);if(!imgs.length&&p)imgs=p.images&&p.images.length?p.images:[p.image];let data={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCategory').value,price:Number(document.getElementById('pPrice').value),stock:Number(document.getElementById('pStock').value),desc:document.getElementById('pDesc').value.trim(),images:imgs.slice(0,4),image:imgs[0]};if(!data.name||!data.image||data.price<=0||data.stock<0)return alert('Add product details and at least one image.');if(p)Object.assign(p,data);else products.push({id:Math.max(0,...products.map(x=>x.id))+1,...data});try{save()}catch(err){alert('Browser storage is full. Try fewer or smaller images.');return}overlay.remove();renderAdmin();toast(p?'Product updated':'Product added successfully')}}
window.openProductPreview=function(id){
 const p=products.find(x=>Number(x.id)===Number(id));
 if(!p){alert('Product details not found.');return;}
 const imgs=(Array.isArray(p.images)&&p.images.length?p.images:[p.image]).filter(Boolean);
 let active=0;
 const modal=document.createElement('div');
 modal.id='productPreviewModal';
 modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(18,29,43,.82);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;';
 const panel=document.createElement('div');
 panel.style.cssText='background:#fff;color:#121d2b;border-radius:18px;width:100%;max-width:850px;max-height:95vh;overflow:auto;position:relative;padding:20px;';
 panel.innerHTML=`<button id="closeProductPreview" style="position:absolute;right:12px;top:8px;font-size:30px;background:#f3eee8;border-radius:50%;width:40px;height:40px;z-index:2">×</button>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px;padding-top:25px">
 <div><img id="previewMainImage" src="${esc(imgs[0]||'')}" style="width:100%;aspect-ratio:1;object-fit:contain;background:#f7f4f0;border-radius:12px">
 <div id="previewThumbs" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px">
 ${imgs.map((src,i)=>`<button type="button" data-photo-index="${i}" style="border:2px solid ${i===0?'#D4AF37':'#e4dbd0'};border-radius:9px;overflow:hidden"><img src="${esc(src)}" style="width:100%;aspect-ratio:1;object-fit:cover"></button>`).join('')}
 </div></div>
 <div style="display:flex;flex-direction:column;justify-content:center;padding:8px">
 <small style="color:#C5A059;font-weight:bold;letter-spacing:2px;text-transform:uppercase">${esc(p.category)}</small>
 <h2 style="font: bold 34px Georgia,serif;margin:12px 0">${esc(p.name)}</h2>
 <strong style="font-size:22px">${money(p.price)}</strong>
 <p style="line-height:1.8;color:#59616b;margin-top:18px">${esc(p.desc)}</p>
 <p style="font-size:12px;color:#667085;margin-top:14px">Available stock: ${Number(p.stock)||0}</p>
 <button id="previewAddToBag" style="background:#121d2b;color:white;border-radius:10px;padding:14px;margin-top:22px;font-size:12px;font-weight:bold;letter-spacing:1px">ADD TO BAG</button>
 </div></div>`;
 modal.appendChild(panel);
 document.body.appendChild(modal);
 panel.querySelector('#closeProductPreview').addEventListener('click',()=>modal.remove());
 modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
 panel.querySelectorAll('[data-photo-index]').forEach(btn=>btn.addEventListener('click',()=>{
   active=Number(btn.dataset.photoIndex);
   panel.querySelector('#previewMainImage').src=imgs[active];
   panel.querySelectorAll('[data-photo-index]').forEach((b,i)=>b.style.borderColor=i===active?'#D4AF37':'#e4dbd0');
 }));
 panel.querySelector('#previewAddToBag').addEventListener('click',()=>{addToCart(p.id);modal.remove()});
};
function editProduct(id){openProductForm(id)}
function deleteProduct(id){if(confirm('Delete this product?')){products=products.filter(p=>p.id!==id);cart=cart.filter(i=>i.id!==id);save();renderAdmin();updateCount();toast('Product deleted')}}
function openCategoryForm(){let name=prompt('Enter new section / category name:');if(!name)return;name=name.trim();if(!name)return;if(categories.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('This section already exists.');categories.push(name);save();renderAdmin();toast('New section added')}
function deleteCategory(name){if(products.some(p=>p.category===name))return alert('This section contains products. Move or delete those products first.');if(confirm('Delete section '+name+'?')){categories=categories.filter(c=>c!==name);save();renderAdmin();toast('Section deleted')}}
function updateOrder(id,status){let o=orders.find(x=>x.id===id);if(o){o.status=status;save();toast('Order status updated')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderStore();updateCount();icons();
</script>
